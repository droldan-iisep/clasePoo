<section class="seccion a2-seccion" id="participantes">

    <!-- Ficha destacada: se actualiza al hacer clic en la grilla -->

    <!-- Grilla: agrega o edita participantes aquí (data-* se usan en el JS) -->

      <button class="a2-item activo" data-nombre="Participante 1" data-pais="Perú" data-rival="Participante 2">P1</button>

      <button class="a2-item" data-nombre="Participante 6" data-pais="España" data-rival="Participante 5">P6</button>
      <button class="a2-item" data-nombre="Participante 7" data-pais="Ecuador" data-rival="Participante 8">P7</button>
      <button class="a2-item" data-nombre="Participante 8" data-pais="Bolivia" data-rival="Participante 7">P8</button>
      <button class="a2-item" data-nombre="Participante 9" data-pais="Uruguay" data-rival="Participante 10">P9</button>
      <button class="a2-item" data-nombre="Participante 10" data-pais="Venezuela" data-rival="Participante 9">P10</button>
    </div>
  </div>
</section>
