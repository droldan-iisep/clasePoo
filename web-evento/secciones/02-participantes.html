<!-- ===================== ALUMNO 2: PARTICIPANTES (NIVEL DIOS) ===================== -->
<section class="seccion a2-seccion" id="participantes">
  <div class="contenedor">
    
    <div class="a2-header">
      <p class="eyebrow">CARTELERA OFICIAL</p>
      <h2 class="titulo-seccion">NUESTROS CHEFS</h2>
      <p class="subtitulo-seccion">Selecciona un chef para ver sus detalles, su distrito y su platillo estrella.</p>
    </div>

    <!-- FICHA DESTACADA PREMIUM -->
    <div class="a2-destacado tarjeta" id="a2-panel">
      <div class="a2-luz-ambiente" id="a2-luz"></div>
      
      <div class="a2-foto-wrapper">
        <div class="a2-foto-grande" id="a2-foto" style="background-image: url('img/chef-gaston.jpg');"></div>
        <div class="a2-badge-pais" id="a2-badge-pais">MIRAFLORES</div>
      </div>
      
      <div class="a2-info">
        <h3 class="a2-nombre" id="a2-nombre">GASTÓN ACURIO</h3>
        <p class="a2-pais" id="a2-pais">MIRAFLORES</p>
        <div class="a2-vs-container">
          <span class="a2-vs-label">PLATO ESTRELLA</span>
          <span class="a2-rival" id="a2-rival">CEVICHE</span>
        </div>
        <p class="a2-frase" id="a2-frase">"La cocina peruana es el motor de nuestra identidad"</p>
      </div>
    </div>

    <!-- GRILLA DE BOTONES -->
    <div class="a2-grilla" id="a2-grilla">
      <!-- 1. Gastón Acurio (Miraflores - Astrid & Gastón) -->
      <button class="a2-item activo" data-nombre="Gastón Acurio" data-pais="Miraflores" data-rival="Ceviche" data-frase="La cocina peruana es el motor de nuestra identidad" style="background-image:url('img/chef-gaston.jpg')">Gastón Acurio</button>
      
      <!-- 2. Teresa Izquierdo (Lince - Nació ahí) -->
      <button class="a2-item" data-nombre="Teresa Izquierdo" data-pais="Lince" data-rival="Ají de Gallina" data-frase="El secreto está en el amor y la sazón" style="background-image:url('img/chef-teresa.jpg')">Teresa Izquierdo</button>
      
      <!-- 3. Mitsuharu Tsumura (Miraflores - Maido) -->
      <button class="a2-item" data-nombre="Mitsuharu Tsumura" data-pais="Miraflores" data-rival="Nikkei" data-frase="La fusión es el arte de crear nuevos sabores" style="background-image:url('img/chef-mitsuharu.jpg')">Mitsuharu Tsumura</button>
      
      <!-- 4. Astrid Gutsche (Miraflores - Astrid & Gastón) -->
      <button class="a2-item" data-nombre="Astrid Gutsche" data-pais="Miraflores" data-rival="Suspiro a la Limeña" data-frase="La repostería es pura magia y precisión" style="background-image:url('img/chef-astrid.jpg')">Astrid Gutsche</button>
      
      <!-- 5. Virgilio Martínez (Barranco - Central) -->
      <button class="a2-item" data-nombre="Virgilio Martínez" data-pais="Barranco" data-rival="Cocina de Altura" data-frase="Cada ingrediente cuenta una historia de nuestro territorio" style="background-image:url('img/chef-virgilio.jpg')">Virgilio Martínez</button>
      
      <!-- 6. Pía León (Barranco - Kjolle) -->
      <button class="a2-item" data-nombre="Pía León" data-pais="Barranco" data-rival="Kjolle" data-frase="La elegancia está en la sencillez de los sabores" style="background-image:url('img/chef-pia.jpg')">Pía León</button>
      
      <!-- 7. Pedro Miguel Schiaffino (San Isidro - Malabar) -->
      <button class="a2-item" data-nombre="Pedro Miguel Schiaffino" data-pais="San Isidro" data-rival="Paiche" data-frase="La Amazonía es el futuro de la cocina" style="background-image:url('img/chef-pedro.jpg')">Pedro M. Schiaffino</button>
      
      <!-- 8. Héctor Solís (Surquillo - Picantería) -->
      <button class="a2-item" data-nombre="Héctor Solís" data-pais="Surquillo" data-rival="Cocina Nikkei" data-frase="El mar nos da los mejores ingredientes" style="background-image:url('img/chef-hector.jpg')">Héctor Solís</button>
      
      <!-- 9. Rafael Osterling (Miraflores - Rafael) -->
      <button class="a2-item" data-nombre="Rafael Osterling" data-pais="Miraflores" data-rival="Rafael" data-frase="La tradición y la vanguardia van de la mano" style="background-image:url('img/chef-rafael.jpg')">Rafael Osterling</button>
      
      <!-- 10. Grimanesa Vargas (Miraflores - Anticuchos) -->
      <button class="a2-item" data-nombre="Grimanesa Vargas" data-pais="Miraflores" data-rival="Anticuchos" data-frase="El secreto está en la paciencia y el buen adobo" style="background-image:url('img/chef-grimanesa.jpg')">Grimanesa Vargas</button>
    </div>
  </div>
</section>

<!-- JS INCRUSTADO -->
<script>
  document.addEventListener('click', function(e) {
    const btn = e.target.closest('.a2-item');
    if (!btn) return;

    const todosLosBotones = document.querySelectorAll('.a2-item');
    todosLosBotones.forEach(function(b) { b.classList.remove('activo'); });
    btn.classList.add('activo');

    const nombre = btn.getAttribute('data-nombre');
    const pais = btn.getAttribute('data-pais');
    const rival = btn.getAttribute('data-rival');
    const frase = btn.getAttribute('data-frase');
    const fotoUrl = btn.style.backgroundImage;

    const elNombre = document.getElementById('a2-nombre');
    const elPais = document.getElementById('a2-pais');
    const elRival = document.getElementById('a2-rival');
    const elFrase = document.getElementById('a2-frase');
    const elBadge = document.getElementById('a2-badge-pais');
    const elFoto = document.getElementById('a2-foto');

    if (elNombre) elNombre.textContent = nombre.toUpperCase();
    if (elPais) elPais.textContent = pais.toUpperCase();
    if (elRival) elRival.textContent = rival.toUpperCase();
    if (elFrase) elFrase.textContent = '"' + frase + '"';
    if (elBadge) elBadge.textContent = pais.toUpperCase();
    if (elFoto && fotoUrl) elFoto.style.backgroundImage = fotoUrl;
  });
</script>
